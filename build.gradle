buildscript {
    // The axion-release plugin (at its latest, 1.21.2) pulls Bouncy Castle 1.81/1.82 onto the
    // plugin classpath, below the 1.84 that fixes GHSA-p93r-85wp-75v3, -cj8j-37rh-8475,
    // -c3fc-8qff-9hwx and -wg6q-6289-32hp. Force the patched version until axion-release ships it.
    // Build-time only; not part of the published artifact.
    configurations.classpath {
        resolutionStrategy {
            force 'org.bouncycastle:bcprov-jdk18on:1.84',
                    'org.bouncycastle:bcpg-jdk18on:1.84',
                    'org.bouncycastle:bcpkix-jdk18on:1.84',
                    'org.bouncycastle:bcutil-jdk18on:1.84'
        }
    }
}

plugins {
    // 1.20.1 is the minimum that works on Gradle 9 — 1.15.1 and earlier call
    // Provider.forUseAtConfigurationTime(), removed in Gradle 9, so the build
    // fails at configuration time on this repo's Gradle 9.2.1 wrapper.
    id 'pl.allegro.tech.build.axion-release' version '1.20.1'
    id 'biz.aQute.bnd.builder' version "$bndVersion" apply false
    id 'com.vanniktech.maven.publish' version '0.34.0' apply false
}

scmVersion {
    tag {
        prefix = 'ical4j-command-'
    }
    versionCreator 'versionWithBranch'
    branchVersionCreator = ['main': 'simple']
    nextVersion {
        suffix = 'pre'
        separator = '-'
    }
}

configure(subprojects) {
    apply plugin: 'java-library'
    apply plugin: 'groovy'
    apply plugin: 'biz.aQute.bnd.builder'
    apply plugin: 'com.vanniktech.maven.publish'

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            url 'https://central.sonatype.com/repository/maven-snapshots/'
        }
        }

    group = 'org.ical4j'
    description = '''\
Manipulate iCalendar data
'''
    version = rootProject.scmVersion.version

    java {
        sourceCompatibility = 17
        targetCompatibility = 17
    }

    test {
        useJUnitPlatform()
    }

    dependencies {
        api libs.ical4j.connector.api, libs.ical4j.integration.api, libs.ical4j.serializer,
                libs.ical4j.vcard, libs.ical4j, libs.ical4j.extensions


//    implementation ("org.eclipse.jetty:jetty-server:$jettyVersion") {
//        exclude group: 'org.slf4j', module: 'slf4j-api'
//    }
//    implementation ("org.eclipse.jetty:jetty-servlet:$jettyVersion") {
//        exclude group: 'org.slf4j', module: 'slf4j-api'
//    }
//    implementation 'org.glassfish.jersey.containers:jersey-container-jetty-http:3.1.1',
//            'org.glassfish.jersey.inject:jersey-hk2:3.1.1'

//    compileOnly "biz.aQute.bnd:biz.aQute.bndlib:$bndVersion"
        annotationProcessor 'org.osgi:osgi.core:8.0.0',
                'org.osgi:org.osgi.service.component.annotations:1.5.0',
                'org.osgi:org.osgi.service.metatype.annotations:1.4.1',
                'org.osgi:org.osgi.annotation:6.0.0'
        // spock
        testImplementation platform(libs.spock.bom), libs.spock.core

        testRuntimeOnly libs.junit.platform
    }

    // Publishing to the Sonatype Central Portal is configured via the vanniktech plugin.
    // Host, auto-release and signing toggles live in gradle.properties
    // (SONATYPE_HOST, SONATYPE_AUTOMATIC_RELEASE, RELEASE_SIGNING_ENABLED).
    // Credentials and the signing key are supplied via ORG_GRADLE_PROJECT_* env vars in CI.
    mavenPublishing {
        coordinates(group.toString(), project.name, version.toString())

        pom {
            name = project.name
            description = project.description
            url = 'http://ical4j.github.io'

            licenses {
                license {
                    name = 'iCal4j - License'
                    url = 'https://raw.githubusercontent.com/ical4j/ical4j/master/LICENSE'
                    distribution = 'repo'
                }
            }

            developers {
                developer {
                    id = 'fortuna'
                    name = 'Ben Fortuna'
                }
            }

            scm {
                url = 'https://github.com/ical4j/ical4j-command'
                connection = 'scm:git@github.com:ical4j/ical4j-command.git'
                developerConnection = 'scm:git@github.com:ical4j/ical4j-command.git'
            }
        }
    }
}