# JVM tests on every push and pull request, plus one native smoke run on linux x64. The full
# native matrix runs only on release tags (release.yml), since native builds are slow.

name: Build

on:
  push:
  pull_request:

permissions: read-all

jobs:
  test:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so axion-release resolves the version.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and JVM smoke run
        run: ./gradlew build jvmSmoke

  native-smoke:
    name: Native smoke (linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Build native executable
        run: ./gradlew nativeCompile --no-configuration-cache

      - name: Smoke suite
        run: ./gradlew nativeSmoke --no-configuration-cache

      - name: Startup time
        run: ./gradlew nativeStartup --no-configuration-cache
