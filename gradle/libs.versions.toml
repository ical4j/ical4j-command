[versions]
ical4j = "4.2.3"
ical4j-vcard = "2.1.0"
ical4j-extensions = "2.0.0"
ical4j-connector = "2.0.0-beta1"
ical4j-integration =  "0.3.1"
ical4j-serializer = "0.4.1"
groovy = "3.0.25"
log4j = "2.25.2"
spock = "2.4-M7-groovy-3.0"
junitVintage = "5.14.1"
picocli = "4.7.7"

[libraries]
ical4j = { module = "org.mnode.ical4j:ical4j", version.ref = "ical4j" }
ical4j-vcard = { module = "org.mnode.ical4j:ical4j-vcard", version.ref = "ical4j-vcard" }
ical4j-extensions = { module = "org.mnode.ical4j:ical4j-extensions", version.ref = "ical4j-extensions" }
ical4j-connector-api = { module = "org.ical4j:ical4j-connector-api", version.ref = "ical4j-connector" }
ical4j-integration-api = { module = "org.ical4j:ical4j-integration-api", version.ref = "ical4j-integration" }
ical4j-serializer = { module = "org.ical4j:ical4j-serializer", version.ref = "ical4j-serializer" }

picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }

night-config-toml = { group = "com.electronwill.night-config", name = "toml", version = "3.8.3"}

groovy = { module = "org.codehaus.groovy:groovy", version.ref = "groovy"}
groovy-test = { module = "org.codehaus.groovy:groovy-test", version.ref = "groovy"}

log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j"}
log4j-slf4j2 = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j"}

spock-bom = { module = "org.spockframework:spock-bom", version.ref = "spock"}
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock"}

junit-jupiter = { group = "org.junit.jupiter", name="junit-jupiter", version.ref = "junitVintage"}
junit-platform = { module = "org.junit.platform:junit-platform-launcher" }
