# On an `ict-<version>` tag: build and smoke-test the native executable on each platform, attach
# them with SHA-256 checksums to a GitHub Release, and publish the jar to Maven Central.

name: Release

on:
  push:
    tags:
      - 'ict-*'

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    os: linux,   arch: x64,   ext: '' }
          - { runner: ubuntu-24.04-arm, os: linux,   arch: arm64, ext: '' }
          - { runner: macos-latest,     os: macos,   arch: arm64, ext: '' }
          - { runner: windows-latest,   os: windows, arch: x64,   ext: '.exe' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and smoke-test the native executable
        run: ./gradlew nativeCompile nativeSmoke --no-configuration-cache

      - name: Name the executable for the release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#ict-}"
          mkdir dist
          cp "build/native/nativeCompile/ict${{ matrix.ext }}" "dist/ict-${version}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ict-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum ict-* > "ict-${GITHUB_REF_NAME#ict-}-checksums.sha256"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "ict ${GITHUB_REF_NAME#ict-}" --generate-notes

  maven-central:
    name: Publish to Maven Central
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Publish release to Central Portal
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
